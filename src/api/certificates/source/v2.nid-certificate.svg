<svg width="450" height="280" viewBox="0 0 450 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="450" height="280" rx="15" fill="white" stroke="#006A4E" stroke-width="2"/>
  
  <!-- Header (Bangladeshi Green) -->
  <path d="M0 15C0 6.71573 6.71573 0 15 0H435C443.284 0 450 6.71573 450 15V50H0V15Z" fill="#006A4E"/>
  
  <!-- Header Text -->
  <text fill="white" xml:space="preserve" style="white-space: pre" font-family="Arial" font-size="14" font-weight="bold" letter-spacing="0em"><tspan x="70" y="20">Government of the People's Republic of Bangladesh</tspan></text>
  <text fill="#F42A41" xml:space="preserve" style="white-space: pre" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="0em"><tspan x="150" y="38">National ID Card / জাতীয় পরিচয়পত্র</tspan></text>

  <!-- Photo Box -->
  <rect x="20" y="70" width="100" height="120" rx="5" fill="#E5E5E5" stroke="#CCCCCC"/>
  <text fill="#666666" font-family="Arial" font-size="10" x="45" y="135">PHOTO</text>

  <!-- Labels & Data -->
  <text fill="#333333" font-family="Arial" font-size="11" font-weight="bold" x="140" y="85">Name:</text>
  <text fill="#000000" font-family="Arial" font-size="12" x="140" y="100">{{$lookup $declaration "citizen.name.firstname"}} {{$lookup $declaration "citizen.name.surname"}}</text>

  <text fill="#333333" font-family="Arial" font-size="11" font-weight="bold" x="140" y="125">Father's Name:</text>
  <text fill="#000000" font-family="Arial" font-size="12" x="140" y="140">{{$lookup $declaration "citizen.fatherName.firstname"}} {{$lookup $declaration "citizen.fatherName.surname"}}</text>

  <text fill="#333333" font-family="Arial" font-size="11" font-weight="bold" x="140" y="165">Mother's Name:</text>
  <text fill="#000000" font-family="Arial" font-size="12" x="140" y="180">{{$lookup $declaration "citizen.motherName.firstname"}} {{$lookup $declaration "citizen.motherName.surname"}}</text>

  <text fill="#333333" font-family="Arial" font-size="11" font-weight="bold" x="20" y="215">Date of Birth:</text>
  <text fill="#F42A41" font-family="Arial" font-size="12" font-weight="bold" x="20" y="230">{{$lookup $declaration "citizen.dob"}}</text>

  <text fill="#333333" font-family="Arial" font-size="11" font-weight="bold" x="140" y="215">ID NO:</text>
  <text fill="#F42A41" font-family="Arial" font-size="16" font-weight="bold" x="140" y="235">{{$lookup $metadata 'legalStatuses.REGISTERED.registrationNumber'}}</text>

  <!-- Smart Chip Icon -->
  <rect x="20" y="150" width="30" height="25" rx="3" fill="#FFD700" stroke="#B8860B"/>
  <line x1="25" y1="155" x2="45" y2="155" stroke="#B8860B" stroke-width="1"/>
  <line x1="25" y1="162.5" x2="45" y2="162.5" stroke="#B8860B" stroke-width="1"/>
  <line x1="25" y1="170" x2="45" y2="170" stroke="#B8860B" stroke-width="1"/>

  <!-- Footer Decor -->
  <rect y="260" width="450" height="20" rx="0" fill="#006A4E" fill-opacity="0.1"/>
  <text fill="#006A4E" font-family="Arial" font-size="9" x="320" y="272">Smart Nagorik Portal</text>
</svg>
